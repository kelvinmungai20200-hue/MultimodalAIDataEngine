name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job-type: [light, ml]

    # Run the heavy 'ml' job only when explicitly requested: on workflow_dispatch,
    # when pushing to the special branch 'ci-ml', or when the PR has the label 'run-ml'.
    if: "matrix.job-type == 'light' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/ci-ml') || contains(github.event.pull_request.labels.*.name, 'run-ml')"

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -sSf http://localhost:6333/collections || exit 1"
          --health-interval=5s
          --health-timeout=30s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.job-type }}" = "light" ]; then
            python -m pip install pytest qdrant-client requests
          else
            # Heavy job: install full requirements (may take long)
            python -m pip install -r backend/requirements.txt
          fi

      - name: Wait for Qdrant to be healthy (with retries)
        run: |
          set -e
          echo "Waiting for Qdrant to become healthy..."
          attempt=0
          max_attempts=30
          while [ $attempt -lt $max_attempts ]; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is up"
              exit 0
            fi
            attempt=$((attempt+1))
            echo "Qdrant not ready yet (attempt ${attempt}/${max_attempts}), sleeping..."
            sleep $((attempt < 10 ? 2 : 5))
          done
          echo "Qdrant did not become healthy after ${max_attempts} attempts"; exit 1

      - name: Run tests
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: test_integration_collection
          QDRANT_UPSERT_MANIFEST: backend/test-output/upserts.json
          VECTOR_DB_MAX_RETRIES: 1
          VECTOR_DB_BACKOFF_BASE: 0.1
        run: |
          python -m pytest -q

      - name: Check for Qdrant upsert manifest
        id: check_manifest
        run: |
          MANIFEST="backend/test-output/upserts.json"
          if [ -f "$MANIFEST" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Qdrant upsert manifest (if present)
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-upserts
          path: backend/test-output/upserts.json
          retention-days: 7
