name: CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/**'
      - 'README.md'
      - 'backend/README_TESTING.md'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/**'
      - 'README.md'
      - 'backend/README_TESTING.md'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC: used to run slow tests

jobs:
  light-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-light-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.12']
        test-suite: ['fast', 'slow', 'integration']

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: ./.github/actions/pip-cache
        with:
          python-version: ${{ matrix.python-version }}
          requirements-file: backend/requirements.txt
          extra-key: -light-${{ matrix.test-suite }}
          wheel-dir: ./.wheelhouse

      - name: Ensure wheelhouse directory exists
        run: |
          mkdir -p ./.wheelhouse || true

      - name: Populate wheelhouse (light path)
        run: |
          echo "Preparing wheelhouse for light job..."
          python -m pip wheel -r backend/requirements.txt -w ./.wheelhouse || true

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links ./.wheelhouse -r backend/requirements.txt || python -m pip install -r backend/requirements.txt
          python -m pip install pytest-xdist pytest-cov coverage codecov

      - name: Wait for Qdrant to be healthy (with retries)
        run: |
          set -e
          echo "Waiting for Qdrant to become healthy..."
          attempt=0
          max_attempts=30
          while [ $attempt -lt $max_attempts ]; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is up"
              exit 0
            fi
            attempt=$((attempt+1))
            echo "Qdrant not ready yet (attempt ${attempt}/${max_attempts}), sleeping..."
            sleep $((attempt < 10 ? 2 : 5))
          done
          echo "Qdrant did not become healthy after ${max_attempts} attempts"; exit 1

      - name: Run tests
        if: ${{ matrix.test-suite != 'slow' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: test_integration_collection
          QDRANT_UPSERT_MANIFEST: backend/test-output/upserts.json
          VECTOR_DB_MAX_RETRIES: 1
          VECTOR_DB_BACKOFF_BASE: 0.1
          PYTEST_XDIST_NUMPROCS: ${{ matrix.test-suite == 'fast' && '4' || '2' }}
        run: |
          if [ "${{ matrix.test-suite }}" = "fast" ]; then
            python -m pytest --cov=backend --cov-report=xml:backend/coverage.xml backend/tests -m "not integration and not slow" -n ${PYTEST_XDIST_NUMPROCS} --dist=loadscope -q
          elif [ "${{ matrix.test-suite }}" = "slow" ]; then
            python -m pytest backend/tests -m "not integration and slow" -n 2 -q
          else
            python -m pytest backend/tests/integration -n 2 -q
          fi

      - name: Upload coverage to Codecov
        if: ${{ matrix.test-suite == 'fast' }}
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Check for Qdrant upsert manifest
        id: check_manifest
        run: |
          MANIFEST="backend/test-output/upserts.json"
          if [ -f "$MANIFEST" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Qdrant upsert manifest (if present)
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-upserts
          path: backend/test-output/upserts.json
          retention-days: 7

  ml-tests:
    # ML jobs: fast tests run on push/pr for ML branches; slow tests run only on schedule or manual dispatch
    runs-on: ubuntu-latest
    concurrency:
      group: ci-ml-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.12']
        test-suite: ['fast', 'slow', 'integration']

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    steps:
      - name: Skip slow ML suite unless scheduled or manually dispatched
        if: ${{ matrix.test-suite == 'slow' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/heads/ci-ml') && !contains(github.event.pull_request.labels.*.name, 'run-ml') }}
        run: echo "Skipping slow ML suite outside manual/scheduled runs."

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: ./.github/actions/pip-cache
        with:
          python-version: ${{ matrix.python-version }}
          requirements-file: backend/requirements.txt
          extra-key: -ml
          wheel-dir: ./.wheelhouse

      - name: Ensure wheelhouse directory exists
        run: |
          mkdir -p ./.wheelhouse || true

      - name: Populate wheelhouse (build wheels for cached dependencies)
        run: |
          echo "Populating wheelhouse (may take a moment on cache miss)..."
          python -m pip wheel -r backend/requirements.txt -w ./.wheelhouse || true

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          # Try installing from the local wheelhouse first (cached); fall back to PyPI when needed
          python -m pip install --no-index --find-links ./.wheelhouse -r backend/requirements.txt || python -m pip install -r backend/requirements.txt
          python -m pip install pytest-xdist pytest-cov coverage codecov

      - name: Wait for Qdrant to be healthy (with retries)
        run: |
          set -e
          echo "Waiting for Qdrant to become healthy..."
          attempt=0
          max_attempts=30
          while [ $attempt -lt $max_attempts ]; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is up"
              exit 0
            fi
            attempt=$((attempt+1))
            echo "Qdrant not ready yet (attempt ${attempt}/${max_attempts}), sleeping..."
            sleep $((attempt < 10 ? 2 : 5))
          done
          echo "Qdrant did not become healthy after ${max_attempts} attempts"; exit 1

      - name: Run tests
        if: ${{ matrix.test-suite != 'slow' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/ci-ml') || contains(github.event.pull_request.labels.*.name, 'run-ml') }}
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: test_integration_collection
          QDRANT_UPSERT_MANIFEST: backend/test-output/upserts.json
          VECTOR_DB_MAX_RETRIES: 1
          VECTOR_DB_BACKOFF_BASE: 0.1
        run: |
          if [ "${{ matrix.test-suite }}" = "fast" ]; then
            python -m pytest --cov=backend --cov-report=xml:backend/coverage.xml backend/tests -m "not integration and not slow" -n auto --dist=loadscope -q
          elif [ "${{ matrix.test-suite }}" = "slow" ]; then
            python -m pytest backend/tests -m "not integration and slow" -q
          else
            python -m pytest backend/tests/integration -q
          fi

      - name: Upload coverage to Codecov
        if: ${{ matrix.test-suite == 'fast' }}
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Check for Qdrant upsert manifest
        id: check_manifest
        run: |
          MANIFEST="backend/test-output/upserts.json"
          if [ -f "$MANIFEST" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Qdrant upsert manifest (if present)
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-upserts
          path: backend/test-output/upserts.json
          retention-days: 7
