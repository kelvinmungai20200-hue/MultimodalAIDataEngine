name: CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/**'
      - 'README.md'
      - 'backend/README_TESTING.md'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/**'
      - 'README.md'
      - 'backend/README_TESTING.md'
  workflow_dispatch:

jobs:
  light-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-light-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.12']
        test-suite: ['core', 'integration']

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -sSf http://localhost:6333/collections || exit 1"
          --health-interval=5s
          --health-timeout=30s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: ./.github/actions/pip-cache
        with:
          python-version: ${{ matrix.python-version }}
          requirements-file: backend/requirements.txt
          extra-key: -light

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist qdrant-client requests

      - name: Wait for Qdrant to be healthy (with retries)
        run: |
          set -e
          echo "Waiting for Qdrant to become healthy..."
          attempt=0
          max_attempts=30
          while [ $attempt -lt $max_attempts ]; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is up"
              exit 0
            fi
            attempt=$((attempt+1))
            echo "Qdrant not ready yet (attempt ${attempt}/${max_attempts}), sleeping..."
            sleep $((attempt < 10 ? 2 : 5))
          done
          echo "Qdrant did not become healthy after ${max_attempts} attempts"; exit 1

      - name: Run tests
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: test_integration_collection
          QDRANT_UPSERT_MANIFEST: backend/test-output/upserts.json
          VECTOR_DB_MAX_RETRIES: 1
          VECTOR_DB_BACKOFF_BASE: 0.1
        run: |
          if [ "${{ matrix.test-suite }}" = "core" ]; then
            python -m pytest backend/tests -m "not integration" -n auto --dist=loadscope -q
          else
            python -m pytest backend/tests/integration -q
          fi

      - name: Check for Qdrant upsert manifest
        id: check_manifest
        run: |
          MANIFEST="backend/test-output/upserts.json"
          if [ -f "$MANIFEST" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Qdrant upsert manifest (if present)
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-upserts
          path: backend/test-output/upserts.json
          retention-days: 7

  ml-tests:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/ci-ml') || contains(github.event.pull_request.labels.*.name, 'run-ml')
    runs-on: ubuntu-latest
    concurrency:
      group: ci-ml-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.12']
        test-suite: ['core', 'integration']

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -sSf http://localhost:6333/collections || exit 1"
          --health-interval=5s
          --health-timeout=30s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: ./.github/actions/pip-cache
        with:
          python-version: ${{ matrix.python-version }}
          requirements-file: backend/requirements.txt
          extra-key: -ml
          wheel-dir: ./.wheelhouse

      - name: Ensure wheelhouse directory exists
        run: |
          mkdir -p ./.wheelhouse || true

      - name: Populate wheelhouse (build wheels for cached dependencies)
        run: |
          echo "Populating wheelhouse (may take a moment on cache miss)..."
          python -m pip wheel -r backend/requirements.txt -w ./.wheelhouse || true

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          # Try installing from the local wheelhouse first (cached); fall back to PyPI when needed
          python -m pip install --no-index --find-links ./.wheelhouse -r backend/requirements.txt || python -m pip install -r backend/requirements.txt
          python -m pip install pytest-xdist

      - name: Wait for Qdrant to be healthy (with retries)
        run: |
          set -e
          echo "Waiting for Qdrant to become healthy..."
          attempt=0
          max_attempts=30
          while [ $attempt -lt $max_attempts ]; do
            if curl -sSf http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is up"
              exit 0
            fi
            attempt=$((attempt+1))
            echo "Qdrant not ready yet (attempt ${attempt}/${max_attempts}), sleeping..."
            sleep $((attempt < 10 ? 2 : 5))
          done
          echo "Qdrant did not become healthy after ${max_attempts} attempts"; exit 1

      - name: Run tests
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: test_integration_collection
          QDRANT_UPSERT_MANIFEST: backend/test-output/upserts.json
          VECTOR_DB_MAX_RETRIES: 1
          VECTOR_DB_BACKOFF_BASE: 0.1
        run: |
          if [ "${{ matrix.test-suite }}" = "core" ]; then
            python -m pytest backend/tests -m "not integration" -n auto --dist=loadscope -q
          else
            python -m pytest backend/tests/integration -q
          fi

      - name: Check for Qdrant upsert manifest
        id: check_manifest
        run: |
          MANIFEST="backend/test-output/upserts.json"
          if [ -f "$MANIFEST" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Qdrant upsert manifest (if present)
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-upserts
          path: backend/test-output/upserts.json
          retention-days: 7
